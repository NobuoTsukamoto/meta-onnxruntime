# This is a basic workflow to help you get started with Actions

name: Bitbake raspberrypi

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 12 * * 5'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  TARGET_VERSION: master
  WORKING_DIR: /home/runner/work
  BUILD_DIR: /mnt/build
  DOWNLOAD_DIR: /home/runner/downloads
  SSTATE_DIR: /mnt/build/sstate-cache

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  bitbake-raspberrypi:

    strategy:
      matrix:
        # target_machine: [raspberrypi-cm, raspberrypi-cm3, raspberrypi, raspberrypi0-2w-64, raspberrypi0-wifi, raspberrypi0, raspberrypi2, raspberrypi3-64, raspberrypi3, raspberrypi4-64, raspberrypi4, raspberrypi5]
        target_machine: [raspberrypi0-2w-64, raspberrypi3-64, raspberrypi4-64, raspberrypi5]
        onnxruntime_version: [1.29.0]
        onnxruntime_genai_version: [0.15.2]
      fail-fast: false

    # The type of runner that the job will run on
    runs-on: ubuntu-22.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Free disk space on root partition (/dev/root)
      - name: Free disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /opt/* || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          sudo apt-get purge -y \
            azure-cli* dotnet-sdk* ghc* google-chrome-stable* \
            firefox* moby-* mongodb* nginx postgresql* \
            temurin-* llvm-* php* powershell ruby* subversion >/dev/null 2>&1 || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          sudo apt-get autoclean -y >/dev/null 2>&1 || true
          echo "=== Disk space after cleanup ==="
          df -h

      # Install essential host packages
      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get -y install gawk wget git diffstat unzip texinfo gcc \
            build-essential chrpath socat cpio python3 python3-pip python3-pexpect xz-utils \
            debianutils iputils-ping python3-git python3-jinja2 \
            pylint xterm zstd liblz4-tool
          sudo apt-get clean
          sudo apt-get autoclean -y

      - name: Prepare build directory
        run: |
          sudo chown -R runner:docker /mnt
          mkdir -p ${BUILD_DIR}
          mkdir -p ${DOWNLOAD_DIR}
          mkdir -p ${SSTATE_DIR}

      - name: Restore cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.SSTATE_DIR }}
          key: cache-${{ matrix.target_machine }}-${{ env.TARGET_VERSION }}-${{ github.run_id }}
          restore-keys: |
            cache-${{ matrix.target_machine }}-${{ env.TARGET_VERSION }}-

      # checkout repository
      - name: Clone poky, meta-raspberrypi, meta-openembedded
        run: |
          git clone --depth 1 -b ${TARGET_VERSION} https://github.com/agherzan/meta-raspberrypi.git
          git clone --depth 1 -b ${TARGET_VERSION} https://github.com/openembedded/openembedded-core.git
          git clone --depth 1 -b ${TARGET_VERSION} https://github.com/openembedded/bitbake.git
          git clone --depth 1 -b ${TARGET_VERSION} https://github.com/openembedded/meta-openembedded.git
        working-directory: ${{ env.WORKING_DIR }}

      # Run bitbake
      - name: Bitbake MACHINE=${{ matrix.target_machine }}, ONNX Runtime version ${{ matrix.onnxruntime_version }}, ORT GenAI version ${{ matrix.onnxruntime_genai_version }}
        run: |
          source ${WORKING_DIR}/openembedded-core/oe-init-build-env ${BUILD_DIR}
          echo BB_NUMBER_THREADS = \"$(nproc)\" >> conf/local.conf
          echo PARALLEL_MAKE = \"-j $(nproc)\" >> conf/local.conf
          echo DL_DIR ?= \"${DOWNLOAD_DIR}\" >> conf/local.conf
          echo SSTATE_DIR ?= \"${SSTATE_DIR}\" >> conf/local.conf
          echo 'INHERIT += "rm_work"' >> conf/local.conf
          echo 'OEQA_BUILDPATHS_SKIP = "/home/runner"' >> conf/local.conf
          echo PREFERRED_VERSION_onnxruntime = \"${{ matrix.onnxruntime_version }}\" >> conf/local.conf
          echo PREFERRED_VERSION_onnxruntime-genai = \"${{ matrix.onnxruntime_genai_version }}\" >> conf/local.conf
          bitbake-layers add-layer ${WORKING_DIR}/meta-openembedded/meta-oe/
          bitbake-layers add-layer ${WORKING_DIR}/meta-openembedded/meta-python/
          bitbake-layers add-layer ${WORKING_DIR}/meta-onnxruntime/meta-onnxruntime/
          bitbake-layers add-layer ${WORKING_DIR}/meta-raspberrypi/
          MACHINE=${{matrix.target_machine}} bitbake onnxruntime  onnxruntime-genai onnxruntime-genai-python-example

      # Show failure logs for meta-onnxruntime recipes
      - name: Show failure logs for meta-onnxruntime recipes
        if: failure()
        run: |
          TARGET_RECIPES="onnxruntime|onnxruntime-genai|onnxruntime-python-label-image-example|onnxruntime-genai-python-example|onnxruntime-test-all|huggingface-hub"
          find ${BUILD_DIR}/tmp/work -regextype posix-extended -regex ".*/(${TARGET_RECIPES})/[^/]+/temp/log\.do_.*" 2>/dev/null | while read logfile; do
            if grep -q "ERROR:" "$logfile" 2>/dev/null; then
              echo "================================================================================"
              echo " Failure Log: $logfile"
              echo "================================================================================"
              tail -n 120 "$logfile"
              echo ""
            fi
          done

      # Remove all files that hasn't been access in 10 days
      - name: Clean SState Cache
        if: always()
        run: |
          test -d ${SSTATE_DIR} && find ${SSTATE_DIR} -type f -mtime +10 -delete

      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ${{ env.SSTATE_DIR }}
          key: cache-${{ matrix.target_machine }}-${{ env.TARGET_VERSION }}-${{ github.run_id }}
